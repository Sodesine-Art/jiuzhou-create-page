<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>九州长歌 · 手机创建页</title>
  <style>
    html,body{margin:0;min-height:100%;background:#d9c7a7;color:#4f361e;font-family:"Noto Serif SC","Microsoft YaHei",serif}
    .jz-mobile-load{display:grid;place-items:center;min-height:360px;padding:24px;box-sizing:border-box;text-align:center}
    .jz-mobile-load__card{width:min(420px,calc(100vw - 32px));padding:28px 22px;border:1px solid #92653b;border-radius:12px;background:#fffaf0;box-shadow:0 12px 30px rgba(55,35,15,.18);line-height:1.8}
    .jz-mobile-load__title{margin:0 0 8px;font-size:1.2rem;color:#7e2f25}
    .jz-mobile-load__text{margin:0;color:#795a35}
  </style>
</head>
<body>
  <main class="jz-mobile-load" aria-live="polite">
    <div class="jz-mobile-load__card">
      <h1 class="jz-mobile-load__title">九州卷正在展开</h1>
      <p class="jz-mobile-load__text" id="jz-mobile-load-status">正在载入手机创建页…</p>
    </div>
  </main>
  <script>
  (() => {
    const sources = [
      'https://raw.githubusercontent.com/Sodesine-Art/jiuzhou-create-page/main/jiuzhou-create.html?v=mobile-r1',
      'https://cdn.jsdelivr.net/gh/Sodesine-Art/jiuzhou-create-page@main/jiuzhou-create.html?v=mobile-r1'
    ];
    const status = document.getElementById('jz-mobile-load-status');
    const mobileCss = String.raw`
/* 九州长歌手机创建页覆盖层：仅在窄容器生效，桌面仍沿用原页面布局 */
@media (max-width: 640px) {
  html,body{width:100%;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  .jz-entry-screen{min-height:min(620px,100dvh);padding-bottom:max(8px,env(safe-area-inset-bottom));}
  .jz-entry-screen .entry-frame{inset:8px;}
  .jz-entry-screen .entry-content{width:100%;height:min(590px,100dvh);min-height:500px;padding:18px 16px 14px;box-sizing:border-box;}
  .jz-entry-screen .entry-poem{display:none;}
  .jz-entry-screen .entry-title{align-self:start;}
  .jz-entry-screen .entry-title strong{font-size:clamp(1.45rem,7vw,2rem);}
  .jz-entry-screen .entry-portrait{max-width:78vw;max-height:53%;bottom:21%;}
  .jz-entry-screen .entry-action{width:min(100%,320px);gap:8px;}
  .jz-entry-screen .entry-button{width:100%;min-height:48px;padding:14px 18px;}
  .jz-page{width:100%;max-width:none;min-height:0!important;height:auto!important;overflow:visible!important;background-image:none;}
  .jz-page .container{width:100%;min-height:0;max-height:none;overflow:visible!important;border-width:3px;border-radius:0;box-shadow:none;}
  .jz-page .first-page-scroll{max-height:none!important;overflow:visible!important;padding-right:0;scrollbar-gutter:auto;}
  .jz-page .accordion-container{padding:8px;}
  .jz-page .accordion-content-inner{padding:14px 10px 20px;}
  .jz-page .wizard-nav{position:sticky;top:0;z-index:20;padding:8px 4px 10px;background:#e8dcc4;border-bottom:1px solid #b08d4f;}
  .jz-page .wizard-step{width:100%;font-size:1.05rem;}
  .jz-page .wizard-dots{order:3;width:100%;}
  .jz-page .wizard-btn{min-height:44px;padding:9px 14px;font-size:.94rem;}
  .jz-page h2{font-size:1.65rem;padding-left:8px;}
  .jz-page h3{font-size:1.25rem;}
  .jz-page p{font-size:1rem;line-height:1.75;}
  .jz-page input,.jz-page select,.jz-page textarea{max-width:100%;font-size:16px;}
  .jz-page textarea{min-height:110px;}
  .jz-page .character-form,.jz-page .form-section{grid-template-columns:minmax(0,1fr)!important;}
  .jz-page .talent-roll-area{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px;}
  .jz-page .talent-card{min-width:0;padding:6px 5px;font-size:.76rem;line-height:1.35;}
  .jz-page .talent-name{margin-bottom:2px;font-size:.88rem;line-height:1.25;word-break:break-word;}
  .jz-page .talent-desc{font-size:.7rem;line-height:1.35;word-break:break-word;}
  .jz-page .preset-selection,.jz-page .archive-controls{flex-wrap:wrap;}
  .jz-page .preset-btn,.jz-page .archive-controls button{min-height:44px;}

  /* 原绝对定位疆域图在手机改为区域选择网格；原有 click 事件和 data/id 保持不变。 */
  .jz-page .map-container{margin:10px 0;}
  .jz-page .map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;width:100%;height:auto!important;min-height:0;overflow:visible!important;padding:9px;border:1px solid #1a1a2e;border-radius:8px;background:linear-gradient(155deg,#f3ead6,#e4d2a8);}
  .jz-page .province{position:relative!important;inset:auto!important;width:auto!important;height:auto!important;min-height:88px;padding:9px 7px;transform:none!important;display:flex;align-items:center;justify-content:center;gap:3px;box-shadow:0 1px 3px rgba(0,0,0,.18);}
  .jz-page .province:hover,.jz-page .province:focus-visible{transform:none!important;box-shadow:0 0 0 2px #a33b2e,0 2px 5px rgba(0,0,0,.18);}
  .jz-page .province-name{font-size:1.15rem;line-height:1.2;}
  .jz-page .province-desc{display:-webkit-box;overflow:hidden;font-size:.78rem;line-height:1.35;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .jz-page .outer-region{min-height:76px;}
  .jz-page .outer-region .province-name{font-size:1.05rem;}
  .jz-page .outer-region .province-desc{font-size:.72rem;}
  .jz-page .province-factions{display:none;}
  .jz-page .map-popover{position:fixed!important;z-index:99999;left:8px!important;right:8px!important;top:auto!important;bottom:max(8px,env(safe-area-inset-bottom))!important;width:auto!important;max-width:none;max-height:min(72dvh,520px);padding:14px;}
  .jz-page .map-popover h3{font-size:1.1rem;}
  .jz-page .faction-map,.jz-page .realm-list{grid-template-columns:repeat(2,minmax(0,1fr));}
  .jz-page .detail-line{align-items:flex-start;gap:6px;}
  .jz-page .detail-line .dl-lbl{min-width:4em;}
  #jz-completion-note{margin:10px auto max(18px,env(safe-area-inset-bottom));padding:0 12px;font-size:.9rem;}
}
@media (max-width: 360px) {
  .jz-page .map,.jz-page .faction-map,.jz-page .realm-list{grid-template-columns:minmax(0,1fr);}
}
@media (prefers-reduced-motion: reduce) {
  .jz-entry-screen *, .jz-entry-screen *::before, .jz-entry-screen *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
}`;
    const mobileScript = String.raw`(() => {
  const mq = window.matchMedia('(max-width: 640px)');
  function applyMobileSemantics() {
    if (!mq.matches) return;
    const map = document.querySelector('.jz-page .map');
    if (map) {
      map.setAttribute('aria-label', '区域选择；点击区域查看详情');
      map.querySelectorAll('.province').forEach((node) => {
        node.setAttribute('role', node.tagName === 'BUTTON' ? 'button' : 'button');
        node.setAttribute('tabindex', '0');
      });
    }
  }
  function notifyLayout() {
    applyMobileSemantics();
    window.dispatchEvent(new Event('resize'));
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', notifyLayout, {once:true});
  else notifyLayout();
  if (mq.addEventListener) mq.addEventListener('change', notifyLayout);
  else mq.addListener(notifyLayout);
})();`;
    async function load() {
      let lastError;
      for (const url of sources) {
        try {
          status.textContent = '正在读取创建页…';
          const response = await fetch(url, {cache:'no-store'});
          if (!response.ok) throw new Error('HTTP ' + response.status);
          const html = await response.text();
          if (!html.includes('九州疆域') || !html.includes('角色摘要')) throw new Error('创建页内容校验失败');
          const styleTag = '<style id="jz-mobile-layout-overrides">' + mobileCss + '</style>';
          const scriptTag = '<scr' + 'ipt id="jz-mobile-layout-binder">' + mobileScript + '</scr' + 'ipt>';
          const patched = html.replace(/<\/head>/i, styleTag + '</head>').replace(/<\/body>/i, scriptTag + '</body>');
          document.open();
          document.write(patched);
          document.close();
          return;
        } catch (error) { lastError = error; }
      }
      status.textContent = '加载失败，请检查网络或稍后重试。';
      console.error('[九州长歌·手机创建页] 加载失败', lastError);
    }
    load();
  })();
  </script>
</body>
</html>
